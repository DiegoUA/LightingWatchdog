name: Build and Release Installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    # We must use windows-latest to natively compile the C# Windows Service 
    # and run the Inno Setup compiler.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Background Service (win-x64)
        run: dotnet publish src/NetworkWatchdogService/NetworkWatchdogService.csproj -r win-x64 -c Release /p:PublishSingleFile=true

      - name: Publish Tray Application (win-x64)
        run: dotnet publish src/NetworkWatchdog.TrayApp/NetworkWatchdog.TrayApp.csproj -r win-x64 -c Release

      - name: Compile Inno Setup Installer
        # GitHub's windows-latest runners have Inno Setup 6 pre-installed.
        # This compiles the script and generates the .exe in installer/Output/
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NetworkWatchdogInstaller.iss

      - name: Generate Release Notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const notes = `Automated release for ${tag}\n\nSee CHANGELOG.md for full details.`;
            core.setOutput('body', notes);

      - name: Publish Release & Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          # This automatically attaches the compiled installer to the GitHub Release!
          files: installer/Output/NetworkWatchdog_Installer.exe
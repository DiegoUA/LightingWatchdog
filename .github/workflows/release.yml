name: Build and Release Installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Background Service (win-x64)
        run: dotnet publish src/NetworkWatchdogService/NetworkWatchdogService.csproj -r win-x64 -c Release /p:PublishSingleFile=true -o out\service

      - name: Publish Tray Application (win-x64)
        # Added /p:PublishSingleFile=true to prevent the silent dependency crash
        run: dotnet publish src/NetworkWatchdog.TrayApp/NetworkWatchdog.TrayApp.csproj -r win-x64 -c Release /p:PublishSingleFile=true -o out\tray

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NetworkWatchdogInstaller.iss

      - name: Generate Release Notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const notes = `Automated release for ${tag}\n\nSee CHANGELOG.md for full details.`;
            core.setOutput('body', notes);

      - name: Publish Release & Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          files: installer/Output/NetworkWatchdog_Installer.exe